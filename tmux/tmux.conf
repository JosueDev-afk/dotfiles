# ==============================================================================
# tmux — https://github.com/JosueDev-afk/dotfiles
# Prefijo: Ctrl-a  (el default Ctrl-b queda lejos del meñique)
# ==============================================================================

# --- Prefijo ------------------------------------------------------------------
unbind C-b
set -g prefix C-a
bind C-a send-prefix          # Ctrl-a dos veces manda un Ctrl-a real a la app

# --- Colores (lo importante para que se vea bien en Ghostty) ------------------
# tmux miente sobre los colores si no le dices qué soporta la terminal de afuera.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"      # 24 bits de color
set -as terminal-features ",xterm-ghostty:usstyle"  # Subrayado ondulado (errores de LSP)
set -g allow-passthrough on                          # Deja pasar imágenes y gráficos

# --- Convivencia con Neovim ---------------------------------------------------
set -sg escape-time 10        # Sin esto, ESC en nvim tarda medio segundo
set -g focus-events on        # nvim se entera cuando cambias de panel

# --- Comodidades --------------------------------------------------------------
set -g mouse on               # Clic para cambiar de panel, arrastrar para redimensionar
set -g history-limit 50000    # Scrollback largo
set -g base-index 1           # Ventanas desde el 1, como las teclas del teclado
setw -g pane-base-index 1
set -g renumber-windows on    # Al cerrar la ventana 2, la 3 pasa a ser la 2
set -g set-clipboard on       # Copiar en tmux copia al portapapeles de macOS
set -g detach-on-destroy off  # Al cerrar una sesión, salta a otra en vez de salirse

# --- Divisiones y navegación --------------------------------------------------
# | y - son más memorables que % y ", y abren en el directorio actual
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# Moverse entre paneles con las teclas de vim
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Redimensionar (se puede repetir sin volver a pulsar el prefijo)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind r source-file ~/.config/tmux/tmux.conf \; display "Config recargada"

# --- Modo copia con teclas de vim ---------------------------------------------
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# --- Apariencia: ámbar sobre gris, igual que Ghostty --------------------------
set -g status-position bottom
set -g status-style "bg=#1c1c1c fg=#f1a53b"
set -g status-left  " #[bold]#S #[nobold]"
set -g status-left-length 30
set -g status-right "#[fg=#6a6a6a]%d %b  #[fg=#f1a53b]%H:%M "

setw -g window-status-format         " #I #W "
setw -g window-status-current-format "#[bg=#f1a53b,fg=#1c1c1c,bold] #I #W "
setw -g window-status-separator ""

set -g pane-border-style        "fg=#3a3a3a"
set -g pane-active-border-style "fg=#f1a53b"
set -g message-style "bg=#f1a53b fg=#1c1c1c bold"

# --- Local / privado ----------------------------------------------------------
if-shell "[ -f ~/.config/tmux/tmux.conf.local ]" "source ~/.config/tmux/tmux.conf.local"
